<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="URBAN O Studio">
<meta name="theme-color" content="#000000">
<link rel="apple-touch-icon" href="app-icon.png">
<link rel="icon" href="app-icon.png">
<title>URBAN O Studio · Portable</title>
<style>
  :root{
    /* URBAN O brand palette (constant across themes) */
    --black:#000000;
    --gold:#F5D74C;      /* Golden Sun */
    --amber:#F69F14;     /* Deep Amber  – energy / CTA */
    --ochre:#D8A93A;     /* Organic Ochre */
    --lime:#68C13B;      /* Fresh Lime */
    --leaf:#138F19;      /* Deep Leaf Green */
    --gray:#32373C;
    --good:#68C13B; --ok:#F5D74C; --meh:#F69F14;
    --radius:16px;
    --font:"Futura","Futura PT","Avenir Next",-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;

    /* ---- dark theme (default) — angeglichen an Mac Theme.swift ---- */
    --bg:#000000; --bg2:#0A0A0A; --card:#141414; --card2:#1c1c1c; --line:#2a2a2a;
    --txt:#ffffff; --muted:#9a9a9a; --dim:#666666; --logo:#ffffff;
    /* t-amber = Mac accent (gold) · t-gold = Mac accentLabel (gedämpft) · t-lime = positive */
    --t-gold:#A89060; --t-amber:#F5D74C; --t-ochre:#D8A93A; --t-lime:#68C13B;
  }
  :root[data-theme="light"]{
    /* warmes Creme wie Mac (F7F5F0 / EDEBE5) */
    --bg:#F7F5F0; --bg2:#EDEBE5; --card:#EFEDE7; --card2:#E5E2DA; --line:#DAD6CC;
    --txt:#1A1A1A; --muted:#666666; --dim:#999999; --logo:#1A1A1A;
    --t-gold:#9B7A30; --t-amber:#F69F14; --t-ochre:#D8A93A; --t-lime:#138F19;
  }
  *{box-sizing:border-box; -webkit-tap-highlight-color:transparent;}
  html,body{margin:0; padding:0; background:var(--bg); color:var(--txt);
    font-family:var(--font); -webkit-font-smoothing:antialiased;
    overflow-x:hidden; max-width:100%;}
  body{min-height:100dvh; padding:env(safe-area-inset-top) env(safe-area-inset-right) env(safe-area-inset-bottom) env(safe-area-inset-left);}
  .app{max-width:520px; margin:0 auto; padding:16px 14px 120px; width:100%; overflow-x:hidden;}
  body,.ctrack,.scard,.pick,.search,.arc,.themetoggle,.reset,.tag,.why .reason,.step{transition:background-color .22s ease,color .22s ease,border-color .22s ease;}

  /* ---- Header / Logo ---- */
  header{display:flex; align-items:center; justify-content:space-between; padding:6px 2px 18px;}
  .brand{display:flex; flex-direction:column; gap:3px;}
  .logo{height:34px; display:block; color:var(--logo);}
  .logo svg{height:100%; width:auto; display:block;}
  .hdr-right{display:flex; align-items:center; gap:12px;}
  .themetoggle{width:34px; height:34px; flex:none; border-radius:50%; border:1px solid var(--line);
    background:var(--card); color:var(--txt); font-size:16px; line-height:1; padding:0;
    display:flex; align-items:center; justify-content:center;}
  .appname{font-size:13px; font-weight:600; letter-spacing:2.5px; text-transform:uppercase;
    color:var(--t-amber); margin-top:7px; display:flex; align-items:center; gap:8px;}
  .appname .demo{font-size:9px; font-weight:700; letter-spacing:1px; color:var(--black);
    background:var(--gold); padding:2px 6px; border-radius:5px;}
  .tagline{font-size:10.5px; color:var(--dim); letter-spacing:1.2px; text-transform:uppercase;}
  .reset{background:var(--card); border:1px solid var(--line); color:var(--muted);
    font-family:var(--font); font-size:11px; letter-spacing:1px; text-transform:uppercase;
    padding:9px 13px; border-radius:11px; font-weight:600;}

  /* ---- Energy arc control ---- */
  .arc{display:flex; gap:6px; background:var(--card); border:1px solid var(--line);
    border-radius:13px; padding:5px; margin-bottom:18px;}
  .arc button{flex:1; background:transparent; border:0; color:var(--muted);
    font-family:var(--font); font-size:11.5px; font-weight:600; letter-spacing:.5px;
    padding:9px 4px; border-radius:9px; display:flex; flex-direction:column; align-items:center; gap:3px;
    text-transform:uppercase;}
  .arc button .ico{font-size:15px;}
  .arc button.on{background:var(--amber); color:var(--black); box-shadow:0 4px 14px rgba(246,159,20,.35);}

  .sectlabel{font-size:10.5px; text-transform:uppercase; letter-spacing:1.6px; color:var(--dim);
    margin:4px 4px 11px; display:flex; justify-content:space-between; align-items:center; font-weight:600;}
  .sectlabel b{color:var(--t-gold); font-weight:700;}

  /* ---- Chain ---- */
  .chain{display:flex; flex-direction:column; gap:0;}
  .chiprow{display:flex; align-items:center; gap:10px;}
  .step{width:23px; height:23px; flex:none; border-radius:50%; background:var(--card2);
    border:1px solid var(--line); display:flex; align-items:center; justify-content:center;
    font-size:11px; color:var(--t-gold); font-weight:700;}
  .ctrack{flex:1; background:var(--card); border:1px solid var(--line); border-radius:13px;
    padding:11px 13px; display:flex; align-items:center; gap:10px;}
  .ctrack.first{border-color:var(--amber);}
  .ctrack .ti{flex:1; min-width:0;}
  .ctrack .ti .t{font-size:14px; font-weight:600; white-space:nowrap; overflow:hidden; text-overflow:ellipsis;}
  .ctrack .ti .a{font-size:11.5px; color:var(--muted); white-space:nowrap; overflow:hidden; text-overflow:ellipsis;}
  .meta{display:flex; gap:6px; flex:none;}
  .tag{font-size:10.5px; font-weight:700; padding:3px 7px; border-radius:6px; letter-spacing:.3px;}
  .tag.key{background:rgba(216,169,58,.16); color:var(--t-ochre);}
  .tag.bpm{background:rgba(104,193,59,.15); color:var(--t-lime);}
  .tag.en{background:rgba(245,215,76,.14); color:var(--t-gold);}
  .connector{height:13px; width:2px; background:var(--line); margin-left:11px;}
  .remove{background:transparent; border:0; color:var(--dim); font-size:18px; padding:0 2px;}

  /* ---- Suggestions ---- */
  .sugg{display:flex; flex-direction:column; gap:10px;}
  .scard{background:var(--card); border:1px solid var(--line); border-radius:var(--radius);
    padding:13px 14px; display:flex; flex-direction:column; gap:9px; position:relative; overflow:hidden;}
  .scard:active{transform:scale(.985);}
  .scard .barbg{position:absolute; left:0; top:0; bottom:0; width:4px; background:var(--line);}
  .scard.s-good .barbg{background:var(--good);}
  .scard.s-ok .barbg{background:var(--ok);}
  .scard.s-meh .barbg{background:var(--meh);}
  .srow{display:flex; align-items:center; gap:10px;}
  .srow .ti{flex:1; min-width:0;}
  .srow .ti .t{font-size:15px; font-weight:600; white-space:nowrap; overflow:hidden; text-overflow:ellipsis;}
  .srow .ti .a{font-size:12px; color:var(--muted); white-space:nowrap; overflow:hidden; text-overflow:ellipsis;}
  .add{flex:none; width:38px; height:38px; border-radius:11px; border:0; font-size:24px; font-weight:300;
    background:var(--amber); color:var(--black); font-family:var(--font);
    box-shadow:0 4px 14px rgba(246,159,20,.35); display:flex; align-items:center; justify-content:center;}
  .why{display:flex; flex-wrap:wrap; gap:6px;}
  .why .reason{font-size:10px; font-weight:600; letter-spacing:.2px; padding:4px 8px; border-radius:7px;
    background:var(--card2); color:var(--muted);}
  .why .reason.hi{background:rgba(104,193,59,.14); color:var(--t-lime);}
  .why .reason.warn{background:rgba(246,159,20,.14); color:var(--t-amber);}

  /* ---- Start picker ---- */
  .search{width:100%; background:var(--card); border:1px solid var(--line); color:var(--txt);
    font-family:var(--font); border-radius:13px; padding:13px 14px; font-size:15px; margin-bottom:12px; outline:none;}
  .search::placeholder{color:var(--dim);}
  .picklist{display:flex; flex-direction:column; gap:8px;}
  .pick{background:var(--card); border:1px solid var(--line); border-radius:13px; padding:12px 13px;
    display:flex; align-items:center; gap:10px;}
  .pick:active{background:var(--card2);}
  .pick .ti{flex:1; min-width:0;}
  .pick .ti .t{font-size:14px; font-weight:600; white-space:nowrap; overflow:hidden; text-overflow:ellipsis;}
  .pick .ti .a{font-size:11.5px; color:var(--muted);}
  .genrepill{font-size:10px; color:var(--dim); text-transform:uppercase; letter-spacing:.5px;}

  .empty{text-align:center; color:var(--dim); font-size:13px; padding:30px 20px; line-height:1.6;}
  .hint{text-align:center; color:var(--dim); font-size:11px; margin-top:20px; line-height:1.5; letter-spacing:.3px;}
  .hint b{color:var(--muted); font-weight:600;}

  /* ---- Tab bar ---- */
  .tabbar{display:flex; gap:2px; border-bottom:1px solid var(--line); margin-bottom:18px;}
  .tab{flex:1; background:transparent; border:0; font-family:var(--font); font-size:10.5px; font-weight:700;
    letter-spacing:.6px; text-transform:uppercase; color:var(--muted); padding:10px 4px 11px;
    position:relative; display:flex; align-items:center; justify-content:center; gap:5px; cursor:pointer;}
  .tico{flex:none; width:14px; height:14px; display:flex; align-items:center; justify-content:center;}
  .tico svg{width:100%; height:100%; display:block;}
  .tab.on{color:var(--t-amber);}
  .tab.on::after{content:""; position:absolute; left:8px; right:8px; bottom:-1px; height:2px;
    background:var(--t-amber); border-radius:2px;}
  .tbadge{font-size:9px; font-weight:700; min-width:16px; text-align:center; color:var(--black);
    background:var(--t-amber); border-radius:8px; padding:1px 5px; letter-spacing:0;}

  /* ---- Save / Reset row buttons ---- */
  .setbtns{display:flex; gap:6px;}
  .reset.save{background:var(--amber); color:var(--black); border-color:var(--amber);}

  /* ---- Play / preview button ---- */
  .play{flex:none; width:30px; height:30px; border-radius:50%; border:1px solid var(--line);
    background:var(--card2); color:var(--t-amber); font-size:11px; line-height:1; padding:0;
    display:flex; align-items:center; justify-content:center; cursor:pointer;
    transition:background-color .2s ease, color .2s ease;}
  .play.playing{background:var(--amber); color:var(--black); border-color:var(--amber);}
  .play.loading{color:var(--muted);}

  /* ---- Service link button (opens Spotify/Apple/YouTube/SoundCloud) ---- */
  .svc{flex:none; width:30px; height:30px; border-radius:50%; border:1px solid var(--line);
    background:var(--card2); color:var(--muted); font-size:13px; line-height:1; padding:0;
    display:flex; align-items:center; justify-content:center; cursor:pointer;}

  /* ---- Service sheet (bottom popup) ---- */
  .sheet{position:fixed; inset:0; z-index:50; display:flex; align-items:flex-end;
    background:rgba(0,0,0,.5); opacity:0; pointer-events:none; transition:opacity .2s ease;}
  .sheet.on{opacity:1; pointer-events:auto;}
  .sheet-card{width:100%; max-width:520px; margin:0 auto; background:var(--card);
    border-radius:20px 20px 0 0; border:1px solid var(--line); border-bottom:0;
    padding:16px 16px calc(20px + env(safe-area-inset-bottom)); transform:translateY(100%);
    transition:transform .25s ease;}
  .sheet.on .sheet-card{transform:translateY(0);}
  .sheet-ttl{font-size:13px; font-weight:700; color:var(--txt); margin:0 2px 3px; white-space:nowrap; overflow:hidden; text-overflow:ellipsis;}
  .sheet-sub{font-size:11px; color:var(--muted); margin:0 2px 14px; white-space:nowrap; overflow:hidden; text-overflow:ellipsis;}
  .sheet a{display:flex; align-items:center; gap:11px; padding:13px 12px; border-radius:12px;
    background:var(--card2); color:var(--txt); text-decoration:none; font-size:14px; font-weight:600;
    margin-bottom:8px;}
  .sheet a .ic{width:22px; text-align:center; font-size:16px;}
  .sheet .close{width:100%; padding:13px; border:0; border-radius:12px; background:transparent;
    color:var(--muted); font-family:var(--font); font-size:13px; font-weight:600; margin-top:4px;}

  /* ---- Mashup share button ---- */
  .mshare{margin-left:auto; background:transparent; border:1px solid var(--line); color:var(--muted);
    font-family:var(--font); font-size:11px; font-weight:600; padding:5px 11px; border-radius:9px;}
  .mstars{margin-left:0;}

  /* ---- History ---- */
  .histlist{display:flex; flex-direction:column; gap:9px;}
  .histcard{background:var(--card); border:1px solid var(--line); border-radius:13px; overflow:hidden;}
  .histcard.open{border-color:var(--amber);}
  .histhead{display:flex; align-items:flex-start; gap:10px; padding:12px 13px; cursor:pointer;}
  .histinfo{flex:1; min-width:0;}
  .histdate{font-size:10px; color:var(--t-amber); letter-spacing:.5px; font-weight:600;}
  .histtitle{font-size:13.5px; font-weight:600; margin:2px 0 4px; white-space:nowrap; overflow:hidden; text-overflow:ellipsis;}
  .histmeta{font-size:10.5px; color:var(--muted); white-space:nowrap; overflow:hidden; text-overflow:ellipsis;}
  .histdel{flex:none; background:transparent; border:0; font-size:15px; padding:2px 4px; opacity:.7; cursor:pointer;}
  .histtracks{border-top:1px solid var(--line); padding:6px 10px 10px;}
  .htrow{display:flex; align-items:center; gap:8px; padding:6px 2px; border-bottom:1px solid var(--line);}
  .htrow:last-child{border-bottom:0;}
  .hidx{width:20px; text-align:right; font-size:11px; color:var(--dim); font-weight:600;}
  .hti{flex:1; min-width:0;}
  .hti .t{font-size:12.5px; font-weight:600; white-space:nowrap; overflow:hidden; text-overflow:ellipsis;}
  .hti .a{font-size:10.5px; color:var(--muted); white-space:nowrap; overflow:hidden; text-overflow:ellipsis;}

  /* ---- Timer ---- */
  .t-intro{font-size:12px; color:var(--muted); margin:0 2px 18px; line-height:1.5;}
  .t-block{background:var(--card); border:1px solid var(--line); border-radius:14px; padding:14px; margin-bottom:12px;}
  .t-row{display:flex; justify-content:space-between; align-items:baseline; margin-bottom:10px;}
  .t-lbl{font-size:13px; font-weight:600; color:var(--txt);}
  .t-lbl.small{font-size:10.5px; text-transform:uppercase; letter-spacing:1px; color:var(--t-amber); font-weight:700; display:block; margin-bottom:6px;}
  .t-val{font-size:20px; font-weight:700; color:var(--t-amber); font-variant-numeric:tabular-nums;}
  .t-help{font-size:10px; color:var(--dim); margin-top:8px;}
  .t-slider{-webkit-appearance:none; appearance:none; width:100%; height:5px; border-radius:3px; background:var(--line); outline:none;}
  .t-slider::-webkit-slider-thumb{-webkit-appearance:none; appearance:none; width:22px; height:22px; border-radius:50%; background:var(--amber); cursor:pointer; box-shadow:0 2px 6px rgba(0,0,0,.4);}
  .t-slider::-moz-range-thumb{width:22px; height:22px; border:0; border-radius:50%; background:var(--amber);}
  .t-conv{display:flex; align-items:center; gap:12px; margin-top:10px;}
  .t-num{width:70px; background:var(--bg2); border:1px solid rgba(246,159,20,.45); color:var(--txt);
    font-family:var(--font); font-size:18px; font-weight:700; text-align:center; padding:8px 6px;
    border-radius:9px; outline:none; -moz-appearance:textfield;}
  .t-num::-webkit-outer-spin-button,.t-num::-webkit-inner-spin-button{-webkit-appearance:none; margin:0;}
  .t-unit{font-size:12px; color:var(--muted);}
  .t-arrow{font-size:15px; color:var(--t-amber);}
  .t-out{font-size:17px; font-weight:700; color:var(--t-amber); font-variant-numeric:tabular-nums;}
  .t-sub{font-size:11px; color:var(--dim); font-variant-numeric:tabular-nums; margin-top:2px;}
  .t-refrow{display:flex; justify-content:space-between; padding:7px 2px; border-bottom:1px solid var(--line); font-size:12px;}
  .t-refrow:last-child{border-bottom:0;}
  .t-refrow b{color:var(--muted); font-weight:600; font-variant-numeric:tabular-nums;}

  /* ---- Mashup Lab ---- */
  .mintro{font-size:11.5px; color:var(--muted); margin:0 4px 12px; line-height:1.4;}
  .mctl{display:flex; flex-wrap:wrap; align-items:center; gap:9px; margin-bottom:14px;}
  .msearch{flex:1; min-width:150px;}
  .mchk{display:flex; align-items:center; gap:7px; font-size:12px; color:var(--muted); font-weight:600;}
  .mchk .box{width:19px; height:19px; border-radius:6px; border:1px solid var(--line);
    background:var(--card); display:flex; align-items:center; justify-content:center;
    font-size:12px; color:var(--black);}
  .mchk .box.on{background:var(--amber); border-color:var(--amber);}
  .mnew{background:var(--amber); color:var(--black); border:0; font-family:var(--font);
    font-size:11.5px; font-weight:700; letter-spacing:.5px; padding:10px 14px; border-radius:11px;
    text-transform:uppercase; box-shadow:0 4px 14px rgba(246,159,20,.35);}
  .mlist{display:flex; flex-direction:column; gap:11px;}
  .mcard{background:var(--card); border:1px solid var(--line); border-radius:var(--radius); overflow:hidden;}
  .mrow{display:flex; align-items:center; gap:10px; padding:11px 13px;}
  .mrole{flex:none; width:50px; text-align:center; font-size:8.5px; font-weight:700; letter-spacing:.5px;
    color:var(--black); padding:4px 0; border-radius:5px;}
  .mrole.voc{background:var(--amber);} .mrole.ins{background:var(--lime);}
  .minfo{flex:1; min-width:0;}
  .mname{font-size:12.5px; font-weight:600; color:var(--txt); white-space:nowrap; overflow:hidden; text-overflow:ellipsis;}
  .mart{font-size:10.5px; color:var(--muted); white-space:nowrap; overflow:hidden; text-overflow:ellipsis; margin-top:1px;}
  .mkey{flex:none; font-size:12px; font-weight:700; color:var(--t-amber); width:34px; text-align:right;}
  .mbpm{flex:none; font-size:12px; color:var(--muted); width:34px; text-align:right; font-variant-numeric:tabular-nums;}
  .mplus{text-align:center; font-size:13px; font-weight:700; color:var(--dim); line-height:0; padding:1px 0;}
  .mfoot{display:flex; align-items:center; gap:7px; padding:9px 13px; background:var(--card2); border-top:1px solid var(--line);}
  .mbadge{font-size:10px; font-weight:600; color:var(--t-amber); background:rgba(246,159,20,.13);
    padding:3px 8px; border-radius:5px;}
  .mbadge.dim{color:var(--muted); background:var(--card);}
  .mstars{margin-left:auto; display:flex; gap:1px;}
  .mstar{font-size:11px; color:var(--line);} .mstar.on{color:var(--gold);}
</style>
</head>
<body>
<div class="app">
  <header>
    <div class="brand">
      <div class="appname">Studio <span class="demo" id="libBadge">DEMO</span></div>
      <div class="tagline">Portable Edition</div>
    </div>
    <div class="hdr-right">
      <button class="themetoggle" id="themeBtn" aria-label="Toggle theme">☀️</button>

  {id:15, t:"Gabriel",                          a:"Roy Davis Jr.",        g:"House",      bpm:125, key:"11A", en:6},
];

/* Load library from localStorage (imported via tracks.json) or fall back to demo */
let TRACKS = DEMO_TRACKS;
let librarySource = 'demo'; // 'demo' | 'imported'
(function(){
  try{
    const saved = localStorage.getItem('sb-library');
    if(saved){
      const parsed = JSON.parse(saved);
      if(Array.isArray(parsed) && parsed.length > 0){
        TRACKS = parsed;
        librarySource = 'imported';
      }
    }
  }catch(e){}
})();

let chain = [];          // track ids in order
let arcDir = "up";       // up | hold | down

/* ---------- App state: tabs, history, timer, mashup ---------- */
let activeTab = "build"; // build | mashup | history | timer
let openHist = null;     // expanded history set id
let mixSeconds = 150;    // timer: mix time per song (default 2:30)
let timerSong = "10";
let timerMin = "60";
const DEFAULT_MIX = 150; // assumed seconds/song for history length estimates

/* mashup state */
let mashupSeed = "";        // filter vocals by name/artist
let mashupHouseOnly = true; // restrict to house genres
let mashupList = [];        // current suggestions
let mashupNonce = 0;        // bump to reshuffle

let history = [];
try{ history = JSON.parse(localStorage.getItem('sb-history') || '[]'); }catch(e){ history = []; }
function saveHistory(){ try{ localStorage.setItem('sb-history', JSON.stringify(history)); }catch(e){} }
function addToHistory(){
  const snap = chain.map(id=>{ const t=byId(id); return {t:t.t,a:t.a,g:t.g,bpm:t.bpm,key:t.key,en:t.en}; });
  history.unshift({ id:'s'+Date.now(), ts:Date.now(), arc:arcDir, tracks:snap });
  saveHistory();
}
function deleteSet(id){ history = history.filter(s=>s.id!==id); saveHistory(); }

function fmtHMS(sec){
  const tot=Math.round(Math.max(sec,0)), h=Math.floor(tot/3600), m=Math.floor((tot%3600)/60), s=tot%60;
  return h>0 ? `${h}:${String(m).padStart(2,'0')}:${String(s).padStart(2,'0')}` : `${m}:${String(s).padStart(2,'0')}`;
}
function fmtDate(ts){
  const d=new Date(ts), mo=['Jan','Feb','Mar','Apr','May','Jun','Jul','Aug','Sep','Oct','Nov','Dec'][d.getMonth()];
  return `${d.getDate()} ${mo} ${d.getFullYear()}, ${String(d.getHours()).padStart(2,'0')}:${String(d.getMinutes()).padStart(2,'0')}`;
}
function arcLabel(a){ return a==='up'?'Build up':(a==='down'?'Wind down':'Hold'); }
function txt(id,s){ const e=document.getElementById(id); if(e) e.textContent=s; }

/* ---------- Audio previews (30s clips via Deezer, JSONP = no CORS) ---------- */
const audioEl = new Audio();
let playingPt = null;          // pt string currently playing
const previewCache = {};       // pt -> url | 'none'
const inflight = {};
audioEl.addEventListener('ended', ()=>{ playingPt=null; refreshPlay(); });

function ptOf(t){ return t.t+'|||'+t.a; }

function jsonp(url){
  return new Promise((resolve,reject)=>{
    const cb='dz_'+Math.random().toString(36).slice(2);
    const s=document.createElement('script');
    let done=false;
    const cleanup=()=>{ try{ delete window[cb]; }catch(e){ window[cb]=undefined; } if(s.parentNode) s.remove(); };
    window[cb]=(data)=>{ done=true; resolve(data); cleanup(); };
    s.onerror=()=>{ if(!done){ reject(new Error('net')); cleanup(); } };
    s.src=url+(url.includes('?')?'&':'?')+'output=jsonp&callback='+cb;
    document.body.appendChild(s);
    setTimeout(()=>{ if(!done){ reject(new Error('timeout')); cleanup(); } }, 8000);
  });
}

async function lookupPreview(pt){
  if(pt in previewCache) return previewCache[pt];
  if(inflight[pt]) return inflight[pt];
  const [title,artist]=pt.split('|||');
  inflight[pt]=(async()=>{
    let url='none';
    try{
      let d=await jsonp('https://api.deezer.com/search?q='+encodeURIComponent('artist:"'+artist+'" track:"'+title+'"')+'&limit=1');
      if(!(d&&d.data&&d.data.length)) d=await jsonp('https://api.deezer.com/search?q='+encodeURIComponent(title+' '+artist)+'&limit=1');
      const hit=d&&d.data&&d.data[0];
      if(hit&&hit.preview) url=hit.preview;
    }catch(e){ url='none'; }
    previewCache[pt]=url; delete inflight[pt]; return url;
  })();
  return inflight[pt];
}
function prefetch(pt){ lookupPreview(pt); }

function refreshPlay(){
  document.querySelectorAll('.play').forEach(b=>{
    if(b.classList.contains('loading')) return;
    if(b.dataset.pt===playingPt){ b.textContent='⏸'; b.classList.add('playing'); }
    else { b.textContent='▶'; b.classList.remove('playing'); }
  });
}

async function playPreview(btn){
  const pt=btn.dataset.pt||'';
  if(playingPt===pt && !audioEl.paused){ audioEl.pause(); playingPt=null; refreshPlay(); return; }
  audioEl.pause();
  const cached=previewCache[pt];
  if(cached && cached!=='none'){          // synchronous play within the tap → iOS-friendly
    audioEl.src=cached;
    audioEl.play().then(()=>{ playingPt=pt; refreshPlay(); })
                  .catch(()=>{ btn.textContent='✕'; setTimeout(refreshPlay,1500); });
    return;
  }
  if(cached==='none'){ btn.textContent='✕'; setTimeout(refreshPlay,1500); return; }
  btn.classList.add('loading'); btn.textContent='⏳';
  const url=await lookupPreview(pt);
  btn.classList.remove('loading');
  if(url && url!=='none'){
    audioEl.src=url;
    try{ await audioEl.play(); playingPt=pt; refreshPlay(); }
    catch(e){ refreshPlay(); }            // iOS may need a second tap the very first time
  } else { btn.textContent='✕'; setTimeout(refreshPlay,1500); }
}

document.addEventListener('click',(e)=>{
  const b=e.target.closest('.play');
  if(!b) return;
  e.stopPropagation(); e.preventDefault();
  playPreview(b);
}, true);

/* iOS audio unlock: first user touch primes the audio element so later
   programmatic play() (after async lookup) is allowed without a 2nd tap. */
let audioPrimed=false;
function primeAudio(){
  if(audioPrimed) return; audioPrimed=true;
  const prev=audioEl.src;
  audioEl.src='data:audio/wav;base64,UklGRiQAAABXQVZFZm10IBAAAAABAAEARKwAAIhYAQACABAAZGF0YQAAAAA=';
  const p=audioEl.play();
  if(p&&p.then) p.then(()=>{ audioEl.pause(); audioEl.currentTime=0; if(prev) audioEl.src=prev; }).catch(()=>{});
}
document.addEventListener('touchend', primeAudio, {once:true, passive:true});
document.addEventListener('click', primeAudio, {once:true});

function playBtn(t){
  const pt=(t.t+'|||'+t.a).replace(/&/g,'&amp;').replace(/"/g,'&quot;').replace(/</g,'&lt;');
  return `<button class="play" data-pt="${pt}">▶</button>`;
}

/* Energy badge: zeigt dein Rekordbox-Energie-Wort (leer wenn kein Tag) */
function enTag(t){ return t.ew ? `<span class="tag en">${t.ew}</span>` : ''; }

/* ---------- Open track in music services (Spotify / Apple / YouTube / SoundCloud) ---------- */
function svcBtn(t){
  const q=encodeURIComponent(t.t+' '+t.a);
  return `<button class="svc" data-q="${q}" aria-label="Open in music service">↗</button>`;
}
const SVC = [
  {n:'Spotify',     ic:'🟢', u:q=>'https://open.spotify.com/search/'+q},
  {n:'Apple Music', ic:'', u:q=>'https://music.apple.com/search?term='+q},
  {n:'YouTube',     ic:'▶️', u:q=>'https://www.youtube.com/results?search_query='+q},
  {n:'SoundCloud',  ic:'🟠', u:q=>'https://soundcloud.com/search?q='+q},
];
const svcSheet=document.getElementById('svcSheet');
const svcCard=document.getElementById('svcCard');
function openServices(q){
  const links=SVC.map(s=>`<a href="${s.u(q)}" target="_blank" rel="noopener"><span class="ic">${s.ic}</span>${s.n}</a>`).join('');
  svcCard.innerHTML=`<div class="sheet-ttl">Open in</div>
    <div class="sheet-sub">${esc(decodeURIComponent(q))}</div>${links}

/* ---------- Camelot harmonic logic ---------- */
function parseKey(k){ return {n:parseInt(k), l:k.slice(-1)}; }
function wheelDist(a,b){ let d=Math.abs(a-b)%12; return Math.min(d,12-d); }

function harmonic(fromKey,toKey){
  const f=parseKey(fromKey), t=parseKey(toKey);
  if(f.n===t.n && f.l===t.l) return {score:100,label:"Same key",cls:"hi"};
  if(f.n===t.n && f.l!==t.l) return {score:88,label:(t.l==="B"?"Major shift":"Minor shift"),cls:"hi"};
  const d=wheelDist(f.n,t.n);
  if(f.l===t.l && d===1) return {score:92,label:"Harmonic neighbor",cls:"hi"};
  if(f.l===t.l && d===2) return {score:68,label:"Energy boost (+2)",cls:""};
  if(f.l!==t.l && d===1) return {score:55,label:"Smooth transition",cls:""};
  if(f.l===t.l && d===3) return {score:42,label:"Bold jump",cls:"warn"};
  return {score:22,label:"Risky – needs a bridge",cls:"warn"};
}

function bpmFit(from,to){
  const pct=Math.abs(to-from)/from*100;
  const diff=(to>from?"+":"")+(to-from);
  if(pct<=1.5) return {score:100,label:"BPM match",cls:"hi"};
  if(pct<=3)   return {score:80,label:diff+" BPM",cls:""};
  if(pct<=5)   return {score:55,label:diff+" BPM (pitch)",cls:"warn"};
  return {score:25,label:diff+" BPM – too far",cls:"warn"};
}

function energyFit(from,to){
  const d=to-from;
  let want;
  if(arcDir==="up")        want = d>=0 && d<=2 ? 100 : (d===3?60 : d<0?40:35);
  else if(arcDir==="down") want = d<=0 && d>=-2 ? 100 : (d===-3?60 : d>0?40:35);
  else /* hold */          want = Math.abs(d)<=1 ? 100 : (Math.abs(d)===2?60:35);
  const sign = d>0?"+"+d : (d<0?String(d):"±0");
  return {score:want,label:"Energy "+sign,cls: want>=90?"hi":(want<=40?"warn":"")};
}

function score(fromTrack,toTrack){
  const h=harmonic(fromTrack.key,toTrack.key);
  const b=bpmFit(fromTrack.bpm,toTrack.bpm);
  const e=energyFit(fromTrack.en,toTrack.en);
  const total = h.score*0.5 + b.score*0.28 + e.score*0.22;
  return {total,h,b,e};
}

const byId = id => TRACKS.find(x=>x.id===id);

  view.innerHTML = `

      <button class="reset" id="clearAll">Clear all</button></div>

  document.getElementById('clearAll').onclick=()=>{

  };

    el.onclick=(e)=>{ e.stopPropagation(); deleteSet(el.dataset.hdel); render(); });

  const open = openHist===s.id;
  const dur = fmtHMS(s.tracks.length*DEFAULT_MIX);
  const genres = [...new Set(s.tracks.map(t=>t.g))].join(' · ');
  const title = s.tracks.length>1 ? `${s.tracks[0].t} → ${s.tracks[s.tracks.length-1].t}` : s.tracks[0].t;
  const tracksHtml = !open ? '' : `<div class="histtracks">${s.tracks.map((t,i)=>`
      <div class="htrow"><span class="hidx">${i+1}</span>
        <div class="hti"><div class="t">${t.t}</div><div class="a">${t.a}</div></div>
        <span class="tag key">${t.key}</span><span class="tag bpm">${t.bpm}</span>${enTag(t)}</div>`).join('')}</div>`;
  return `<div class="histcard ${open?'open':''}">
      <div class="histhead" data-hopen="${s.id}">
        <div class="histinfo">
          <div class="histdate">${fmtDate(s.ts)}</div>
          <div class="histtitle">${title}</div>
          <div class="histmeta">${s.tracks.length} tracks · ≈ ${dur} · ${arcLabel(s.arc)}${genres?' · '+genres:''}</div>

  view.innerHTML = `
    <div class="sectlabel">Set Timer</div>
    <p class="t-intro">Work out where you are in your set, time-wise — independent of the build parameters.</p>
    <div class="t-block">
      <div class="t-row"><span class="t-lbl">Mix time per song</span><span class="t-val" id="tMix">—</span></div>

      <div class="t-help">How long you play a song on average (mixed), e.g. 2:30</div>
    </div>
    <div class="t-block">
      <div class="t-lbl">At which song?</div>
      <div class="t-conv">
        <input type="number" inputmode="numeric" id="tSong" class="t-num" value="${timerSong}">
        <span class="t-arrow">→</span>

  const mix=Math.max(mixSeconds,1);
  const n=Math.max(parseInt(timerSong)||1,1);
  const m=Math.max(parseFloat(timerMin)||0,0);
  txt('tMix',fmtHMS(mix));
  txt('tSongOut','≈ '+fmtHMS((n-1)*mix)+' into set');
  txt('tSongSub','plays until '+fmtHMS(n*mix));
  txt('tMinOut','≈ Song '+(Math.floor((m*60)/mix)+1));
  txt('tRefLbl','Quick reference (at '+fmtHMS(mix)+'/song)');
  const ref=document.getElementById('tRef');
  if(ref) ref.innerHTML=[60,90,120,180,240].map(mins=>

}

function renderPicker(){
  hint.innerHTML="Sample tracks &mdash; your real Rekordbox library plugs in later.";
  view.innerHTML = `
    <div class="sectlabel">Pick a starting track</div>
    <input class="search" id="q" placeholder="Search – title, artist, genre…" autocomplete="off">

  const q=document.getElementById('q');
  const list=document.getElementById('picklist');
  function draw(){
    const term=q.value.toLowerCase();
    const shown = TRACKS.filter(t=>!term || (t.t+t.a+t.g).toLowerCase().includes(term));
    shown.slice(0,12).forEach(t=>prefetch(ptOf(t)));
    list.innerHTML = shown
      .map(t=>`<div class="pick" data-id="${t.id}">${playBtn(t)}${svcBtn(t)}
          <div class="ti"><div class="t">${t.t}</div>

        </div>`).join('');
    list.querySelectorAll('.pick').forEach(el=>
      el.onclick=()=>{ chain=[+el.dataset.id]; render(); });

function renderBuilder(){
  hint.innerHTML="Tap <b>+</b> to add the next track. Order = your set.";
  const last = byId(chain[chain.length-1]);

  const sugg = TRACKS.filter(t=>!chain.includes(t.id))
    .map(t=>({t, s:score(last,t)}))
    .sort((a,b)=>b.s.total-a.s.total)
    .slice(0,6);

  sugg.forEach(({t})=>prefetch(ptOf(t)));
  chain.forEach(id=>prefetch(ptOf(byId(id))));

  const chainHtml = chain.map((id,i)=>{
    const t=byId(id);
    return `${i>0?'<div class="connector"></div>':''}
      <div class="chiprow">
        <div class="step">${i+1}</div>
        <div class="ctrack ${i===0?'first':''}">${playBtn(t)}${svcBtn(t)}
          <div class="ti"><div class="t">${t.t}</div><div class="a">${t.a}</div></div>
          <div class="meta"><span class="tag key">${t.key}</span>
            <span class="tag bpm">${t.bpm}</span>${enTag(t)}</div>
          ${i===chain.length-1 && chain.length>1 ? `<button class="remove" data-rm>×</button>`:''}
        </div>
      </div>`;
  }).join('');

  const suggHtml = sugg.map(({t,s})=>{
    const cls = s.total>=78?'s-good':(s.total>=58?'s-ok':'s-meh');
    const reasons = [
      `<span class="reason ${s.h.cls}">${last.key}→${t.key} · ${s.h.label}</span>`,
      `<span class="reason ${s.b.cls}">${s.b.label}</span>`,
      `<span class="reason ${s.e.cls}">${s.e.label}</span>`
    ].join('');
    return `<div class="scard ${cls}" data-add="${t.id}">
        <div class="barbg"></div>
        <div class="srow">${playBtn(t)}${svcBtn(t)}
          <div class="ti"><div class="t">${t.t}</div>
            <div class="a">${t.a} · <span class="genrepill">${t.g}</span></div></div>
          <div class="meta"><span class="tag key">${t.key}</span>
            <span class="tag bpm">${t.bpm}</span>${enTag(t)}</div>
          <button class="add">+</button>
        </div>
        <div class="why">${reasons}</div>
      </div>`;
  }).join('');

  view.innerHTML = `
    <div class="arc" id="arc">
      <button data-dir="up"   class="${arcDir==='up'?'on':''}"><span class="ico">↗</span>Build up</button>
      <button data-dir="hold" class="${arcDir==='hold'?'on':''}"><span class="ico">→</span>Hold</button>
      <button data-dir="down" class="${arcDir==='down'?'on':''}"><span class="ico">↘</span>Wind down</button>
    </div>

    <div class="sectlabel"><span>Your set · <b>${chain.length} ${chain.length===1?'track':'tracks'}</b></span><div class="setbtns"><button class="reset save" id="saveBtn">Save</button><button class="reset" id="resetBtn">Reset</button></div></div>
    <div class="chain">${chainHtml}</div>

    <div class="sectlabel" style="margin-top:20px;">Plays well next <b>from ${last.key} · ${last.bpm}${last.ew?(' · '+last.ew):''}</b></div>
    <div class="sugg">${suggHtml || '<div class="empty">No more tracks left.</div>'}</div>`;

  view.querySelectorAll('[data-add]').forEach(el=>
    el.onclick=()=>{ chain.push(+el.dataset.add); render();
      window.scrollTo({top:0,behavior:'smooth'}); });
  const rm=view.querySelector('[data-rm]');
  if(rm) rm.onclick=(e)=>{ e.stopPropagation(); chain.pop(); render(); };
  view.querySelectorAll('#arc button').forEach(el=>
    el.onclick=()=>{ arcDir=el.dataset.dir; render(); });
  const rs=view.querySelector('#resetBtn');
  if(rs) rs.onclick=()=>{ chain=[]; arcDir="up"; render(); window.scrollTo({top:0,behavior:'smooth'}); };
  const sv=view.querySelector('#saveBtn');
  if(sv) sv.onclick=()=>{ addToHistory(); sv.textContent='Saved ✓'; renderTabs();
    setTimeout(()=>{ const b=view.querySelector('#saveBtn'); if(b) b.textContent='Save'; },1400); };
  refreshPlay();
}

/* ---------- Mashup Lab ---------- */
const MASHUP_HOUSE = new Set(["House","Afro House","Tech House","Deep House",
  "Afro Tech","Deep Tech","Melodic House","Organic House","Latin House"]);

function mashupRelation(a,b){
  const f=parseKey(a), t=parseKey(b);
  if(!f.l||!t.l||isNaN(f.n)||isNaN(t.n)) return null;
  if(f.n===t.n && f.l===t.l) return {label:"Same key", w:3.0};
  if(f.n===t.n && f.l!==t.l) return {label:"Relative maj/min", w:2.5}; // 8A ↔ 8B
  if(f.l===t.l && wheelDist(f.n,t.n)===1) return {label:"Adjacent ±1", w:2.0};
  return null;
}
function mashupStars(w,delta){ let s=Math.floor(w); if(delta<=1) s+=1; return Math.min(Math.max(s,1),4); }
function shuffled(arr){ const a=arr.slice(); for(let i=a.length-1;i>0;i--){ const j=Math.floor(Math.random()*(i+1)); [a[i],a[j]]=[a[j],a[i]]; } return a; }

function buildMashups(){
  const valid = t => t.bpm>0 && !isNaN(parseKey(t.key).n) && parseKey(t.key).l
                     && (!mashupHouseOnly || MASHUP_HOUSE.has(t.g));
  const seed = mashupSeed.trim().toLowerCase();
  let vocals = TRACKS.filter(t=>t.v==="Vocal" && valid(t));
  const instr = TRACKS.filter(t=>(t.v==="Instrumental"||t.v==="Percussive") && valid(t));
  if(seed) vocals = vocals.filter(t=> (t.t+' '+t.a).toLowerCase().includes(seed));
  if(!vocals.length || !instr.length){ mashupList=[]; return; }

  const batch=[];
  for(const v of shuffled(vocals)){
    const partners=[];
    for(const inst of instr){
      if(inst.id===v.id) continue;
      const rel=mashupRelation(v.key, inst.key);
      if(!rel) continue;
      const delta=Math.abs(v.bpm-inst.bpm);
      if(delta>6) continue;
      partners.push({v, inst, rel:rel.label, w:rel.w, delta, score:rel.w*10-delta});
    }
    if(!partners.length) continue;
    partners.sort((a,b)=>b.score-a.score);
    batch.push(...partners.slice(0,2));
    if(batch.length>=24) break;
  }
  mashupList = batch.slice(0,24);
}

function mashTrackRow(role, t, cls){
  return `<div class="mrow">
    <span class="mrole ${cls}">${role}</span>
    <div class="minfo"><div class="mname">${esc(t.t)}</div><div class="mart">${esc(t.a)}</div></div>
    <span class="mkey">${t.key}</span><span class="mbpm">${t.bpm}</span>
    ${playBtn(t)}${svcBtn(t)}</div>`;
}
function esc(s){ return (s||'').replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;'); }

function renderMashup(){
  buildMashups();
  mashupList.slice(0,8).forEach(m=>{ prefetch(ptOf(m.v)); prefetch(ptOf(m.inst)); });
  const cards = mashupList.map(m=>{
    const stars = mashupStars(m.w, m.delta);
    const starHtml = [0,1,2,3].map(i=>`<span class="mstar ${i<stars?'on':''}">★</span>`).join('');
    const share = encodeURIComponent(
      `🎚️ Mashup idea\n${m.v.t} – ${m.v.a} (${m.v.key}/${m.v.bpm})\n+ ${m.inst.t} – ${m.inst.a} (${m.inst.key}/${m.inst.bpm})\n${m.rel} · Δ${m.delta} BPM`);
    return `<div class="mcard">
      ${mashTrackRow('VOCAL', m.v, 'voc')}
      <div class="mplus">+</div>
      ${mashTrackRow('INSTR', m.inst, 'ins')}
      <div class="mfoot">
        <span class="mbadge">${m.rel}</span>
        <span class="mbadge dim">Δ${m.delta} BPM</span>
        <button class="mshare" data-share="${share}">⇪ Share</button>
        <span class="mstars">${starHtml}</span>
      </div></div>`;
  }).join('');

  view.innerHTML = `
    <div class="sectlabel"><span>Mashup Lab</span></div>
    <p class="mintro">A vocal layered over an instrumental/percussive track — matched by key &amp; BPM. Ideas for your own edits.</p>
    <div class="mctl">
      <input class="search msearch" id="mSeed" placeholder="Filter by a vocal…" value="${esc(mashupSeed)}">
      <label class="mchk" id="mHouse"><span class="box ${mashupHouseOnly?'on':''}">${mashupHouseOnly?'✓':''}</span> House only</label>
      <button class="mnew" id="mNew">⤜ New ideas</button>
    </div>
    ${mashupList.length ? `<div class="mlist">${cards}</div>`
      : `<div class="empty">No matching pairs found.<br>Turn off <b>House only</b> or clear the filter.</div>`}`;

  const seedEl=document.getElementById('mSeed');
  seedEl.oninput=(e)=>{ mashupSeed=e.target.value; const pos=e.target.selectionStart; renderMashup();
    const ns=document.getElementById('mSeed'); ns.focus(); ns.setSelectionRange(pos,pos); };
  document.getElementById('mHouse').onclick=()=>{ mashupHouseOnly=!mashupHouseOnly; renderMashup(); };
  document.getElementById('mNew').onclick=()=>{ renderMashup(); window.scrollTo({top:0,behavior:'smooth'}); };
  view.querySelectorAll('.mshare').forEach(el=>el.onclick=(e)=>{
    e.stopPropagation();
    const txt=decodeURIComponent(el.dataset.share);
    if(navigator.share){ navigator.share({text:txt}).catch(()=>{}); }
    else if(navigator.clipboard){ navigator.clipboard.writeText(txt); el.textContent='✓ Copied'; setTimeout(()=>{el.textContent='⇪ Share';},1500); }
  });
  refreshPlay();
}

render();

/* ---------- Auto-load tracks.json from server (when hosted) ---------- */
(function autoLoadLibrary(){
  // Cache-buster + no-store so an updated library always shows up (iOS caches hard)
  fetch('tracks.json?v=' + Date.now(), {cache:'no-store'})
    .then(r => r.ok ? r.json() : Promise.reject())
    .then(data => {
      if(Array.isArray(data) && data.length > 0){
        TRACKS = data;
        librarySource = 'imported';
        try{ localStorage.setItem('sb-library', JSON.stringify(data)); }catch(e){}
        updateLibBadge();
        if(chain.length){ const ids=new Set(TRACKS.map(t=>t.id)); chain=chain.filter(id=>ids.has(id)); }
        render();
      }
    })
    .catch(()=>{ /* offline / local file → keep localStorage or demo */ });
})();
